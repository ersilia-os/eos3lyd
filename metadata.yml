Title: Efflux pump avoidance in gram-negative bacteria
Description: Estimates whether a compound will evade the multidrug efflux pumps that expel antibacterials from Gram-negative cells, one of the two barriers, alongside outer membrane permeability, that keeps most chemistry from reaching its target. Gurvic and Zachariae combined molecular simulation with machine learning to identify the structural modifications that reduce recognition by AcrB-type pumps, offering design guidance rather than a single verdict. Efflux avoidance alone does not confer antibacterial activity.
