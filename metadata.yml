Title: Efflux pump avoidance in gram-negative bacteria
Description: Estimates whether a compound slips past the multidrug efflux pumps that
  expel antibacterials from Gram-negative cells, one of the two barriers, alongside
  outer membrane permeability, that keeps most chemistry from reaching its target.
  Gurvic and Zachariae compared growth inhibition of 73,737 CO-ADD compounds across
  wild-type, efflux-deficient tolC and hyperpermeable lpxC Escherichia coli, labelling
  186 as efflux evaders and 554 as substrates. Ersilia trained the classifier served
  here on those two classes. Evading efflux does not by itself confer antibacterial
  activity.
